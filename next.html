<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pulse Health — Verified</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#faf9f6;--paper:#fff;--ink:#1a2e29;--muted:#7a8a85;--line:#e8e4dc;--teal:#2d6a5c;--teal-soft:#e8f3ef;--mint:#d1e8de;}
  html,body{height:100%;margin:0;}
  body{
    font-family:'Inter',sans-serif; background:var(--bg); color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; -webkit-font-smoothing:antialiased; letter-spacing:-0.01em;
    background-image:radial-gradient(700px 500px at 75% 10%, rgba(209,232,222,0.4), transparent 60%);
  }
  .card{
    text-align:center; padding:56px 48px; max-width:440px; width:92%;
    background:var(--paper); border-radius:28px;
    box-shadow:0 2px 6px rgba(45,106,92,0.04), 0 20px 50px rgba(45,106,92,0.08);
  }
  .ring{
    width:96px; height:96px; margin:0 auto 24px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(145deg, var(--mint), var(--teal));
    color:#fff; box-shadow:0 12px 32px rgba(45,106,92,0.3);
    animation:pop .6s cubic-bezier(0.2, 0.9, 0.3, 1.2);
  }
  .ring svg{width:44px; height:44px;}
  @keyframes pop{0%{transform:scale(.4);opacity:0;}65%{transform:scale(1.08);}100%{transform:scale(1);opacity:1;}}
  h2{font-family:'Fraunces',serif; font-size:34px; font-weight:500; letter-spacing:-0.03em; margin:0 0 12px;}
  h2 em{font-style:italic; color:var(--teal);}
  p{font-size:15px; color:var(--muted); line-height:1.6; margin:0;}
  .stamp{
    margin-top:28px; padding-top:22px; border-top:1px solid var(--line);
    display:flex; justify-content:center; gap:18px;
    font-size:11.5px; color:var(--muted);
  }
  .stamp span::before{content:"✓ "; color:var(--teal); font-weight:700;}
</style>
</head>
<body>
  <div class="card">
    <div class="ring">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h2>You're <em>verified</em>.</h2>
    <p>Your health records are now accessible. Redirecting…</p>
    <div class="stamp">
      <span>Secure</span><span>Encrypted</span><span>HIPAA</span>
    </div>
  </div>
  <script>
    setTimeout(function(){
      var d = new URLSearchParams(location.search).get("to");
      location.href = d || "https://www.google.com";
    }, 1800);
  </script>
</body>
</html>
